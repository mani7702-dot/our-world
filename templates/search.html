<section class="page-head search-page">
  <div class="container">
    <span class="kicker">Search</span>
    <h1>Search Our World</h1>
    <p>Look through every story and news item — try a word from a title, a topic like animals or space, or a tag.</p>
  </div>
</section>

<section class="zone zone--plain search-page">
  <div class="container">
    <div class="search-form" role="search">
      <label class="search-label" for="q">Search stories and news</label>
      <input class="search-input" id="q" name="q" type="search" inputmode="search"
             placeholder="Try “sky”, “turtle” or “space”" autocomplete="off"
             autocapitalize="none" spellcheck="false" enterkeyhint="search">
    </div>

    <div class="search-results" id="results" role="status" aria-live="polite">
      <p class="search-hint">Type a word — titles, topics and tags.</p>
    </div>

    <p class="search-back"><a class="search-back-link" href="../blog/index.html">Or browse the blog instead</a></p>
  </div>
</section>

<script src="../assets/js/search.js" defer></script>
