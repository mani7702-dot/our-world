<section class="page-head">
  <div class="container">
    <span class="kicker" style="--zone:#15803d">Blog</span>
    <h1>Fresh from the blog</h1>
    <p>Posts about reading, learning, friendship and the small science of everyday things — written to be read alone or together.</p>
  </div>
</section>

<section class="zone zone--blog">
  <div class="container">
    <div class="zone-head" data-reveal>
      <div>
        <span class="kicker">All posts</span>
        <h2>{{COUNT}} posts and counting</h2>
        <p class="intro">New posts land here the moment they are published.</p>
      </div>
    </div>
    <div style="display:grid;gap:18px">
      {{ROWS}}
    </div>
  </div>
</section>
