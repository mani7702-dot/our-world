<section class="page-head">
  <div class="container">
    <span class="kicker" style="--zone:#1d4ed8">News</span>
    <h1>The world this week</h1>
    <p>Real events from around the world, explained short and calm — nothing scary left in.</p>
  </div>
</section>

<section class="zone zone--news">
  <div class="container">
    <div class="zone-head" data-reveal>
      <div>
        <span class="kicker">All news</span>
        <h2>{{COUNT}} stories this week</h2>
        <p class="intro">New items are added as they happen, written for curious readers of every age.</p>
      </div>
    </div>
    {{POPULAR}}
    <ul class="news-list">
      {{LIST}}
    </ul>
  </div>
</section>
